services:
  express-backend:
    profiles:
      - legacy-express
    build:
      context: ./Source-code/SWD392_FinalProject_HistoryTalk/wdp301-backend
      dockerfile: Dockerfile
    container_name: historytalk-express
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb+srv://datdat2kk5:datdat2kk5@historytalkdb.l3pzqfp.mongodb.net/?appName=HistoryTalkDB
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=hellowdp301letsgetthehighestgradepossible
      - JWT_EXPIRES_IN=7d
      - AI_SERVICE_URL=http://historytalk-ai:8001
    networks:
      - historytalk-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  historytalk-java:
    image: ghcr.io/dinhtqse/historytalk-java:latest # Dùng image từ GHCR
    container_name: historytalk-java
    restart: unless-stopped
    env_file:
      - path: .env.java.prod
        required: false
      - path: .env.java.dev
        required: false
    networks:
      - historytalk-net
    environment:
      - AI_SERVICE_URL=http://historytalk-ai:8001
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/Historical-tell/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  historytalk-ai:
    image: ghcr.io/dinhtqse/historytalk-ai:latest # Dùng image từ GHCR
    container_name: historytalk-ai
    restart: unless-stopped
    env_file:
      - path: .env.ai.prod
        required: false
      - path: .env.ai.dev
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - historytalk-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1500M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: historytalk-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./Source-code/SWD392_FinalProject_HistoryTalk/monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - historytalk-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  grafana:
    image: grafana/grafana:11.2.2
    container_name: historytalk-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://historytalk.app/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./Source-code/SWD392_FinalProject_HistoryTalk/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Source-code/SWD392_FinalProject_HistoryTalk/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - historytalk-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  caddy:
    image: caddy:2-alpine
    container_name: historytalk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - historytalk-net
    depends_on:
      historytalk-java:
        condition: service_healthy
      historytalk-ai:
        condition: service_healthy

networks:
  historytalk-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
