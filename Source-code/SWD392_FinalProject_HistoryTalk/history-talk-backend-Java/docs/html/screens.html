<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HistoryTalk Screen Wireframes</title>
<style>
  :root {
    --bg: #f4f4f5; --paper: #ffffff; --ink: #27272a; --muted: #71717a; --line: #a1a1aa; --soft: #e4e4e7; --fill: #f4f4f5;
    --pub: #334155; --cus: #2563eb; --tea: #16a34a; --sa: #d97706; --ca: #7c3aed; --sys: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 13px; }
  header.top { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid var(--soft); padding: 12px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header.top h1 { font-size: 18px; margin: 0; }
  header.top a { color: var(--cus); text-decoration: none; font-size: 14px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .filters button { font: inherit; border: 1px solid var(--soft); background: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .layout { display: grid; grid-template-columns: 250px 1fr; gap: 24px; padding: 24px; max-width: 1400px; margin: 0 auto; }
  nav.toc { position: sticky; top: 70px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; background: #fff; border: 1px solid var(--soft); border-radius: 10px; padding: 12px; }
  nav.toc h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 4px; }
  nav.toc h3:first-child { margin-top: 0; }
  nav.toc a { display: block; color: var(--ink); text-decoration: none; padding: 3px 6px; border-radius: 6px; }
  nav.toc a:hover { background: var(--fill); }
  .note { background: #fff; border: 1px solid var(--soft); border-radius: 10px; padding: 10px 14px; margin-bottom: 20px; color: var(--muted); }

  /* screen card */
  .screen { margin-bottom: 34px; scroll-margin-top: 80px; }
  .shead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .shead .sid { font-weight: 700; padding: 2px 8px; border-radius: 6px; color: #fff; }
  .shead h2 { font-size: 16px; margin: 0; }
  .shead .meta { color: var(--muted); }
  .shead button { margin-left: auto; font: inherit; font-size: 12px; border: 1px solid var(--soft); background: #fff; border-radius: 6px; padding: 3px 10px; cursor: pointer; }

  /* browser frame */
  .frame { background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; max-width: 1100px; }
  .chrome { display: flex; align-items: center; gap: 8px; background: var(--fill); border-bottom: 2px solid var(--ink); padding: 6px 10px; }
  .chrome i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
  .chrome .url { flex: 1; background: #fff; border: 1.5px solid var(--line); border-radius: 6px; padding: 2px 8px; color: var(--muted); font-family: Consolas, monospace; font-size: 12px; }
  .appbar { display: flex; align-items: center; gap: 16px; padding: 8px 14px; border-bottom: 1.5px solid var(--line); }
  .appbar .logo { font-weight: 800; letter-spacing: .02em; }
  .appbar .menu { display: flex; gap: 14px; color: var(--muted); }
  .appbar .menu b { color: var(--ink); text-decoration: underline; }
  .appbar .right { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .avatar { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--fill); display: inline-block; }
  .shell { display: grid; grid-template-columns: 180px 1fr; min-height: 340px; }
  .side { border-right: 1.5px solid var(--line); padding: 10px; background: #fafafa; }
  .side div { padding: 6px 8px; border-radius: 6px; color: var(--muted); }
  .side div.on { background: var(--soft); color: var(--ink); font-weight: 600; }
  .content { padding: 16px 18px; }
  .center { display: flex; justify-content: center; padding: 26px 16px; }
  .center > .card { width: 420px; }

  /* popup */
  .dim { background: repeating-linear-gradient(45deg, #e4e4e7 0 8px, #f4f4f5 8px 16px); padding: 34px 16px; display: flex; justify-content: center; }
  .modal { background: #fff; border: 2px dashed var(--ink); border-radius: 14px; width: 460px; padding: 16px 18px; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
  .modal .mt { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; margin-bottom: 10px; }

  /* wireframe components */
  .h { font-size: 16px; font-weight: 700; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 8px; }
  .row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 10px; }
  .row.mid { align-items: center; }
  .row.end { justify-content: flex-end; }
  .row.between { justify-content: space-between; align-items: center; }
  .grow { flex: 1; min-width: 180px; }
  .card { border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
  .field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; min-width: 120px; }
  .field label { font-size: 12px; color: var(--muted); }
  .input { border: 1.5px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 30px; color: var(--muted); background: #fff; }
  .input.area { min-height: 62px; }
  .input.sel::after { content: " ▾"; float: right; }
  .btn { display: inline-block; border: 1.5px solid var(--ink); border-radius: 6px; padding: 6px 14px; background: #fff; font-weight: 600; white-space: nowrap; }
  .btn.p { background: var(--ink); color: #fff; }
  .btn.sm { padding: 2px 8px; font-size: 12px; font-weight: 500; }
  .btn.block { display: block; text-align: center; }
  .link { color: var(--ink); text-decoration: underline; }
  .chk { display: inline-flex; gap: 6px; align-items: center; margin-right: 12px; }
  .chk i { width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 3px; display: inline-block; text-align: center; line-height: 11px; font-style: normal; font-size: 11px; }
  .chk.r i { border-radius: 50%; }
  .tabs { display: flex; border-bottom: 1.5px solid var(--line); margin-bottom: 12px; }
  .tabs span { padding: 6px 12px; color: var(--muted); }
  .tabs span.on { color: var(--ink); font-weight: 700; border: 1.5px solid var(--line); border-bottom: 2px solid #fff; border-radius: 6px 6px 0 0; margin-bottom: -1.5px; background: #fff; }
  .img { border: 1.5px solid var(--line); border-radius: 6px; background:
          linear-gradient(to top right, transparent calc(50% - 1px), var(--soft) 50%, transparent calc(50% + 1px)),
          linear-gradient(to top left, transparent calc(50% - 1px), var(--soft) 50%, transparent calc(50% + 1px)), #fafafa;
         display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; text-align: center; }
  table.t { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  table.t th, table.t td { border: 1.5px solid var(--soft); padding: 6px 8px; text-align: left; vertical-align: middle; }
  table.t th { background: var(--fill); font-weight: 600; }
  .badge { display: inline-block; border: 1.5px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 11px; }
  .badge.ok { border-color: #16a34a; color: #166534; }
  .badge.warn { border-color: #d97706; color: #92400e; }
  .badge.bad { border-color: #dc2626; color: #991b1b; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .stat .v { font-size: 18px; font-weight: 700; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .chart { border: 1.5px solid var(--line); border-radius: 8px; height: 130px; display: flex; align-items: flex-end; gap: 6px; padding: 10px; position: relative; }
  .chart b { flex: 1; background: var(--soft); border: 1.5px solid var(--line); border-bottom: none; }
  .chart span { position: absolute; top: 6px; left: 10px; color: var(--muted); font-size: 12px; }
  .map { border: 1.5px solid var(--line); border-radius: 8px; background: #f0fdf4; position: relative; overflow: hidden; }
  .map::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--soft) 1px, transparent 1px), linear-gradient(90deg, var(--soft) 1px, transparent 1px); background-size: 40px 40px; opacity: .7; }
  .pin { position: absolute; transform: translate(-50%, -100%); font-size: 12px; white-space: nowrap; }
  .pin::before { content: "📍"; margin-right: 2px; }
  .bubble { max-width: 72%; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; }
  .bubble.ai { background: var(--fill); }
  .bubble.me { margin-left: auto; border-color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .chips span { border: 1.5px dashed var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
  .pager { text-align: center; color: var(--muted); letter-spacing: .2em; }
  .qr { width: 150px; height: 150px; border: 2px solid var(--ink); background:
        repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px),
        repeating-linear-gradient(0deg, transparent 0 6px, #fff 6px 12px); opacity: .85; }
  .slider { height: 6px; border-radius: 3px; background: var(--soft); position: relative; margin: 10px 0; }
  .slider::after { content: ""; position: absolute; left: 35%; top: -6px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; }
  .dropzone { border: 2px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); margin-bottom: 10px; }
  .muted { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav.toc { position: static; max-height: none; } .shell { grid-template-columns: 1fr; } .side { display: none; } .grid3, .grid4 { grid-template-columns: 1fr 1fr; } }
  @media print { header.top, nav.toc, .shead button { display: none; } .layout { display: block; padding: 0; } .screen { break-inside: avoid; } }
</style>
</head>
<body>
<header class="top">
  <h1>HistoryTalk – Screen Wireframes</h1>
  <a href="index.html">← Index</a>
  <a href="diagrams.html">Diagrams →</a>
  <div class="filters" id="filters"></div>
</header>
<div class="layout">
  <nav class="toc" id="toc"></nav>
  <main>
    <div class="note">Bản phác bố cục (low-fidelity) cho các màn hình trong SRS mục 3.2 – 3.12. Khung viền nét liền = màn hình; khung nét đứt trên nền gạch chéo = pop-up. Ô có dấu X = ảnh/media. Mỗi màn hình có nút <b>⬇ PNG</b> để chèn vào báo cáo Word.</div>
    <div id="screens"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// ───────────── Component helpers ─────────────
const h = t => `<div class="h">${t}</div>`;
const sub = t => `<p class="sub">${t}</p>`;
const row = (...x) => `<div class="row">${x.join("")}</div>`;
const rowMid = (...x) => `<div class="row mid">${x.join("")}</div>`;
const rowEnd = (...x) => `<div class="row end">${x.join("")}</div>`;
const rowB = (...x) => `<div class="row between">${x.join("")}</div>`;
const grow = (...x) => `<div class="grow">${x.join("")}</div>`;
const card = (...x) => `<div class="card">${x.join("")}</div>`;
const inp = (label, val = "", w) => `<div class="field" ${w ? `style="width:${w}px"` : ""}>${label ? `<label>${label}</label>` : ""}<div class="input">${val}</div></div>`;
const sel = (label, val = "Tất cả", w) => `<div class="field" ${w ? `style="width:${w}px"` : ""}>${label ? `<label>${label}</label>` : ""}<div class="input sel">${val}</div></div>`;
const area = (label, val = "") => `<div class="field">${label ? `<label>${label}</label>` : ""}<div class="input area">${val}</div></div>`;
const btn = (t, p) => `<span class="btn${p ? " p" : ""}">${t}</span>`;
const sm = t => `<span class="btn sm">${t}</span>`;
const bigBtn = (t, p = true) => `<span class="btn block${p ? " p" : ""}">${t}</span>`;
const link = t => `<span class="link">${t}</span>`;
const chk = (t, on) => `<span class="chk"><i>${on ? "✓" : ""}</i>${t}</span>`;
const rad = (t, on) => `<span class="chk r"><i>${on ? "●" : ""}</i>${t}</span>`;
const tabs = (arr, on = 0) => `<div class="tabs">${arr.map((t, i) => `<span class="${i === on ? "on" : ""}">${t}</span>`).join("")}</div>`;
const img = (label, hgt = 90, w) => `<div class="img" style="height:${hgt}px;${w ? `width:${w}px;flex:none` : ""}">${label}</div>`;
const tbl = (head, rows) => `<table class="t"><tr>${head.map(x => `<th>${x}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
const badge = (t, tone = "") => `<span class="badge ${tone}">${t}</span>`;
const stats = arr => `<div class="stats">${arr.map(([k, v]) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")}</div>`;
const chart = (label, bars = [40, 65, 50, 80, 60, 90, 70]) => `<div class="chart"><span>${label}</span>${bars.map(b => `<b style="height:${b}%"></b>`).join("")}</div>`;
const map = (hgt, pins = []) => `<div class="map" style="height:${hgt}px">${pins.map(([t, x, y]) => `<span class="pin" style="left:${x}%;top:${y}%">${t}</span>`).join("")}</div>`;
const ai = t => `<div class="bubble ai"><b>AI:</b> ${t}</div>`;
const me = t => `<div class="bubble me"><b>Bạn:</b> ${t}</div>`;
const chips = arr => `<div class="chips">${arr.map(x => `<span>${x}</span>`).join("")}</div>`;
const pager = () => `<div class="pager">‹ 1 2 3 … 8 ›</div>`;
const drop = t => `<div class="dropzone">📁 ${t}</div>`;
const g2 = (...x) => `<div class="grid2">${x.join("")}</div>`;
const g3 = (...x) => `<div class="grid3">${x.join("")}</div>`;
const g4 = (...x) => `<div class="grid4">${x.join("")}</div>`;

// ───────────── Frames ─────────────
const ROLE = {
  pub: { name: "Public", color: "var(--pub)" },
  cus: { name: "Learner", color: "var(--cus)" },
  stu: { name: "School Student", color: "var(--cus)" },
  tea: { name: "Teacher", color: "var(--tea)" },
  sa:  { name: "School Admin", color: "var(--sa)" },
  ca:  { name: "Content Admin", color: "var(--ca)" },
  sys: { name: "System Admin", color: "var(--sys)" }
};
const LEARNER_MENU = ["Trang chủ", "Bối cảnh", "Nhân vật", "Bản đồ", "Quiz", "Bài tập"];
const SIDE = {
  tea: ["Lớp của tôi", "Bài tập", "Nội dung địa phương", "Yêu cầu token", "Thống kê lớp"],
  sa:  ["Tổng quan", "Lớp học", "Giáo viên", "Học sinh", "Nội dung địa phương", "Hạn mức token", "Ticket token"],
  ca:  ["Bối cảnh", "Nhân vật", "Tài liệu & OCR", "Quiz & Ngân hàng", "Báo cáo câu hỏi", "Bản đồ", "Thùng rác", "Nhiệm vụ ngày"],
  sys: ["Tổng quan", "Trường học", "Người dùng", "Gói dịch vụ", "Thanh toán", "— Nội dung —"]
};
const chrome = url => `<div class="chrome"><i></i><i></i><i></i><div class="url">historytalk.vn${url}</div></div>`;

function frameAuth(s) { return `${chrome(s.url)}<div class="center"><div class="card">${s.body}</div></div>`; }
function frameLearner(s) {
  const menu = LEARNER_MENU.map(m => m === s.menu ? `<b>${m}</b>` : m).join("</span><span>");
  return `${chrome(s.url)}<div class="appbar"><span class="logo">HistoryTalk</span><div class="menu"><span>${menu}</span></div><div class="right">🪙 1.420 token <span class="avatar"></span></div></div><div class="content">${s.body}</div>`;
}
function frameAdmin(s) {
  const items = SIDE[s.role].map(m => `<div class="${m === s.menu ? "on" : ""}">${m}</div>`).join("");
  return `${chrome(s.url)}<div class="appbar"><span class="logo">HistoryTalk</span><span class="muted">${ROLE[s.role].name}${s.school ? " · THPT A" : ""}</span><div class="right">🔔 <span class="avatar"></span></div></div><div class="shell"><div class="side">${items}</div><div class="content">${s.body}</div></div>`;
}
function framePopup(s) { return `${chrome(s.url)}<div class="dim"><div class="modal"><div class="mt"><span>${s.modalTitle || s.title}</span><span>✕</span></div>${s.body}</div></div>`; }
function render(s) {
  const k = s.kind || "learner";
  if (k === "auth") return frameAuth(s);
  if (k === "admin") return frameAdmin(s);
  if (k === "popup") return framePopup(s);
  return frameLearner(s);
}

// ───────────── Screens ─────────────
const S = [];
const add = o => S.push(o);

// ===== 3.2 Authentication & Account =====
add({ id: "S-02", title: "Login", sec: "3.2.1", role: "pub", kind: "auth", url: "/login", body:
  h("ĐĂNG NHẬP HỆ THỐNG") + sub("HistoryTalk – Chắp cánh tri thức lịch sử") +
  inp("Email", "nguyenvana@gmail.com") + inp("Mật khẩu", "•••••••• 👁") +
  rowEnd(link("Quên mật khẩu?")) + bigBtn("ĐĂNG NHẬP") +
  `<p class="sub" style="text-align:center;margin:10px 0">— HOẶC —</p>` + bigBtn("(G) Tiếp tục với Google", false) +
  `<p class="sub" style="text-align:center;margin-top:10px">Chưa có tài khoản? ${link("Đăng ký ngay")}</p>` });

add({ id: "S-03", title: "Register", sec: "3.2.2", role: "pub", kind: "auth", url: "/register", body:
  h("ĐĂNG KÝ TÀI KHOẢN") + inp("Tên đăng nhập *", "3–50 ký tự") + inp("Email *") + inp("Mật khẩu *", "≥ 8 ký tự") + inp("Xác nhận mật khẩu *") +
  bigBtn("ĐĂNG KÝ") + `<p class="sub" style="text-align:center;margin-top:10px">Đã có tài khoản? ${link("Đăng nhập")}</p>` });

add({ id: "S-04", title: "Forgot / Reset Password", sec: "3.2.3", role: "pub", kind: "popup", url: "/login", modalTitle: "Quên mật khẩu", body:
  g2(card(`<b>Bước 1</b>`, inp("Email"), bigBtn("Gửi liên kết")),
     card(`<b>Bước 2 (từ email)</b>`, inp("Mật khẩu mới"), inp("Xác nhận mật khẩu"), bigBtn("Đặt lại mật khẩu"))) +
  sub("Luôn hiển thị MSG05 sau bước 1. Liên kết hiệu lực 15 phút.") });

add({ id: "S-05", title: "Change Password", sec: "3.2.4", role: "pub", kind: "auth", url: "/profile/change-password", body:
  h("ĐỔI MẬT KHẨU") + sub("⚠ Vì lý do bảo mật, vui lòng đổi mật khẩu trước khi tiếp tục (lần đăng nhập đầu).") +
  inp("Mật khẩu hiện tại") + inp("Mật khẩu mới", "6–100 ký tự") + inp("Xác nhận mật khẩu mới") + rowB(btn("Hủy"), btn("Lưu mật khẩu", true)) });

add({ id: "S-06", title: "User Profile", sec: "3.2.5", role: "cus", menu: "", url: "/profile", body:
  h("HỒ SƠ CÁ NHÂN") +
  row(`<div style="width:150px">${img("Ảnh đại diện", 120)}<div style="margin-top:6px">${sm("Đổi ảnh (≤ 5 MB)")}</div></div>`,
      grow(g2(inp("Tên đăng nhập (chỉ đọc)", "thpta_hs_hs1023"), inp("Vai trò / Gói", "Học sinh · free"),
              inp("Họ tên", "Nguyễn Văn An"), inp("Ngày sinh", "15/01/2008"),
              sel("Giới tính", "Nam"), inp("Số điện thoại", "0901234567")), inp("Địa chỉ"))) +
  rowB(row(btn("Đổi mật khẩu"), btn("Vô hiệu hóa tài khoản"), btn("Đăng xuất")), btn("Lưu thay đổi", true)) });

// ===== 3.3 Learning content =====
add({ id: "S-07", title: "Learner Home", sec: "3.6.1", role: "cus", menu: "Trang chủ", url: "/home", body:
  rowB(h("XIN CHÀO, AN!"), row(badge("🔥 Chuỗi 5 ngày", "warn"), btn("Điểm danh", true))) +
  tabs(["Tổng quan", "Nhiệm vụ hằng ngày"], 1) +
  tbl(["Nhiệm vụ", "Tiến độ", "Thưởng", ""], [

// ───────────── Build page ─────────────
const GROUPS = [
  ["pub", "Public & Auth"], ["cus", "Learner"], ["stu", "Student"], ["tea", "Teacher"],
  ["sa", "School Admin"], ["ca", "Content Admin"], ["sys", "System Admin"]
];
const host = document.getElementById("screens");
const toc = document.getElementById("toc");

for (const [key, label] of GROUPS) {
  const list = S.filter(s => s.role === key);
  if (!list.length) continue;
  const h3 = document.createElement("h3"); h3.textContent = label; h3.dataset.role = key; toc.appendChild(h3);
  for (const s of list) {
    const a = document.createElement("a"); a.href = "#" + s.id; a.textContent = `${s.id} ${s.title}`; a.dataset.role = key; toc.appendChild(a);
    const el = document.createElement("section");
    el.className = "screen"; el.id = s.id; el.dataset.role = key;
    el.innerHTML = `
      <div class="shead">
        <span class="sid" style="background:${ROLE[key].color}">${s.id}</span>
        <h2>${s.title}${s.kind === "popup" ? " (pop-up)" : ""}</h2>
        <span class="meta">SRS ${s.sec} · ${ROLE[key].name}</span>
        <button>⬇ PNG</button>
      </div>
      <div class="frame">${render(s)}</div>`;
    el.querySelector("button").onclick = () => exportPng(el.querySelector(".frame"), s.id);
    host.appendChild(el);
  }
}

// role filter
const filters = document.getElementById("filters");
[["all", "Tất cả"], ...GROUPS].forEach(([k, label], i) => {
  const b = document.createElement("button"); b.textContent = label; if (i === 0) b.classList.add("on");
  b.onclick = () => {
    filters.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on");
    document.querySelectorAll("[data-role]").forEach(n => { n.style.display = (k === "all" || n.dataset.role === k) ? "" : "none"; });
  };
  filters.appendChild(b);
});

function exportPng(node, id) {
  if (!window.html2canvas) { alert("html2canvas chưa tải được (cần internet)."); return; }
  html2canvas(node, { backgroundColor: "#ffffff", scale: 2 }).then(c => {
    c.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `historytalk-${id}.png`; a.click(); });
  });
}
</script>
