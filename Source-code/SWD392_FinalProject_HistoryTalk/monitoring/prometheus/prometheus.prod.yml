global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "historytalk-java-backend"
    metrics_path: "/Historical-tell/actuator/prometheus"
    static_configs:
      - targets:
          - "historytalk-java:8080"
        labels:
          service: "history-talk-backend-java"

  - job_name: "historytalk-ai-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "historytalk-ai:8001"
        labels:
          service: "history-talk-backend-ai"
