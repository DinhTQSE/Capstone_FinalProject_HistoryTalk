version: '3.8'

services:
  # =============================================================================
  # 1. PostgreSQL Database Service (historical_schema + pgcrypto)
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: historytalk-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: historytalk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - historytalk-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d historytalk_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # 2. Java Backend Service (Spring Boot 3.2.x, JDK 21, Flyway, PayOS)
  # =============================================================================
  historytalk-java:
    build:
      context: ./Source-code/SWD392_FinalProject_HistoryTalk/history-talk-backend-Java
      dockerfile: Dockerfile
    container_name: historytalk-java
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/historytalk_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_SCHEMA: historical_schema
      JWT_SECRET: default_local_development_jwt_secret_key_32bytes_long
      JWT_EXPIRATION_MS: 86400000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      AI_SERVICE_URL: http://historytalk-ai:8001
    networks:
      - historytalk-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/Historical-tell/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # 3. Python AI Service (FastAPI, LangChain, Supabase / Ollama)
  # =============================================================================
  historytalk-ai:
    build:
      context: ./Source-code/SWD392_FinalProject_HistoryTalk/history-talk-backend-AI
      dockerfile: Dockerfile
    container_name: historytalk-ai
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - historytalk-java
    environment:
      JAVA_BACKEND_URL: http://historytalk-java:8080/Historical-tell
      APP_HOST: 0.0.0.0
      APP_PORT: 8001
      DEBUG: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - historytalk-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  historytalk-net:
    driver: bridge

volumes:
  postgres_data:
